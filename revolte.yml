revolte:
  version: '1.0'
  project: test-python
  appName: django-project
  config:
    codeReview:
      summarize: true
      suggestFixes: true
      commentStyle: Balanced
    testSuite:
      command: python3 manage.py test
    automationTestSuite:
      command: python3 manage.py test:automation
  workflow:
    developerWorkflow:
      enabled: true
  env:
    staging:
      branch: staging
      codeReview: true
      testSuite: true
      automationTestSuite: true
      services:
        rid_1:
          type: WEB_SERVICE
          name: web_service
          entryPoint: python3 manage.py runserver 0.0.0.0:8080
          properties:
            health: /health
            port: 8080
            loadBalancerMode: dedicated
            variables:
              BASE_URL: /
              DATABASE_USER: '#{db.dbUsername}'
              DATABASE_HOST: '#{db.dbUrl}'
              DATABASE_PORT: '#{db.dbPort}'
              DATABASE_PASSWORD: '#{db.dbPassword}'
              DATABASE_NAME: '#{db.dbName}'
              PORT: 8080
          specifications:
            cpu: 2
            memory: 1
            storage: 30
        rid_2:
          type: DATABASE
          name: db
          specifications:
            cpu: 2
            memory: 1
            storage: 30
            engine: postgres
    qa:
      branch: qa
      codeReview: true
      testSuite: true
      automationTestSuite: true
      services:
        rid_1:
          type: WEB_SERVICE
          name: web_service
          entryPoint: python3 manage.py runserver
          properties:
            health: /health
            port: 8080
            loadBalancerMode: dedicated
            variables:
              BASE_URL: /
              DATABASE_HOST: ep-morning-night-aqfia1du.c-8.us-east-1.aws.neon.tech
              DATABASE_USER: neondb_owner
              DATABASE_PASSWORD: npg_f9oFWg0tTRym
              DATABASE_NAME: neondb
          specifications:
            cpu: 2
            memory: 1
            storage: 30
        rid_2:
          type: DATABASE
          name: db
          specifications:
            cpu: 2
            memory: 1
            storage: 30
            engine: postgres
    production:
      branch: main
      codeReview: true
      testSuite: true
      automationTestSuite: true
      services:
        rid_1:
          type: WEB_SERVICE
          name: web_service
          entryPoint: python3 manage.py runserver
          properties:
            health: /health
            port: 8080
            loadBalancerMode: dedicated
            variables:
              BASE_URL: /
              DATABASE_HOST: ep-morning-night-aqfia1du.c-8.us-east-1.aws.neon.tech
              DATABASE_USER: neondb_owner
              DATABASE_PASSWORD: npg_f9oFWg0tTRym
              DATABASE_NAME: neondb
          specifications:
            cpu: 2
